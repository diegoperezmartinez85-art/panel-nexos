<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>NEXOS — EMERGENCIA</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
    body{
      background:#0f0f11;
      color:white;
      font-family:-apple-system,system-ui,sans-serif;
      min-height:100dvh;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      padding:24px;
      user-select:none;
    }
 
    /* ── PANTALLA INICIAL (SETUP) ── */
    .pantalla{ width:100%; max-width:380px; text-align:center; display:none; }
    .pantalla.visible{ display:block; }
    
    .logo{ font-size:13px; letter-spacing:4px; color:#555; margin-bottom:40px; }
    
    .setup-box{
      background:#1a1a1e;
      border:1px solid #2e2e38;
      border-radius:24px;
      padding:28px 24px;
      margin-bottom:24px;
    }
    
    .setup-title{ font-size:18px; font-weight:900; color:#fff; margin-bottom:24px; }
    .setup-subtitle{ font-size:13px; color:#888; letter-spacing:1px; margin-bottom:20px; }
    
    .form-box{
      background:#1a1a1e;
      border:1px solid #2e2e38;
      border-radius:24px;
      padding:28px 24px;
      margin-bottom:24px;
    }
    .form-title{ font-size:15px; color:#888; letter-spacing:2px; margin-bottom:20px; }
    
    .campo{
      width:100%;
      background:#24242a;
      border:2px solid #2e2e38;
      border-radius:14px;
      padding:20px;
      color:white;
      font-size:28px;
      font-weight:700;
      text-align:center;
      outline:none;
      margin-bottom:12px;
      -moz-appearance:textfield;
    }
    .campo::placeholder{ color:#444; font-size:18px; font-weight:400; }
    .campo:focus{ border-color:#e74c3c; }
 
    /* ── BOTÓN PÁNICO REDONDO ── */
    .pantalla-panico{
      width:100%;
      max-width:380px;
      display:none;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:20px;
    }
    .pantalla-panico.visible{
      display:flex;
    }
    
    .info-config{
      text-align:center;
      color:#888;
      font-size:13px;
      margin-bottom:10px;
    }
    .info-config strong{
      color:#00d4d4;
      font-weight:800;
    }
    
    .boton-redondo-container{
      width:280px;
      height:280px;
      display:flex;
      align-items:center;
      justify-content:center;
      margin:40px 0;
    }
    
    .boton-redondo{
      width:100%;
      height:100%;
      border-radius:50%;
      background:linear-gradient(135deg, #c0392b 0%, #e74c3c 100%);
      border:none;
      color:white;
      font-size:60px;
      font-weight:900;
      cursor:pointer;
      transition:all 0.2s ease;
      box-shadow:0 10px 40px rgba(192, 57, 43, 0.4);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:10px;
      position:relative;
      overflow:hidden;
    }
    
    .boton-redondo::before{
      content:'';
      position:absolute;
      top:0;
      left:0;
      right:0;
      bottom:0;
      background:radial-gradient(circle at 30% 30%, rgba(255,255,255,0.1), transparent);
      pointer-events:none;
    }
    
    .boton-redondo:active{
      transform:scale(0.95);
      background:linear-gradient(135deg, #96281b 0%, #b8360f 100%);
      box-shadow:0 5px 20px rgba(192, 57, 43, 0.6);
    }
    
    .boton-redondo:disabled{
      background:#444;
      box-shadow:none;
      cursor:not-allowed;
    }
    
    .boton-texto{
      font-size:18px;
      font-weight:700;
      letter-spacing:1px;
      text-align:center;
      line-height:1.2;
    }
    
    /* ── BOTÓN CONFIGURAR ── */
    .btn-cfg-main{
      background:#1a1a1e;
      color:#00d4d4;
      border:1px solid #00d4d4;
      border-radius:50px;
      padding:14px 40px;
      font-size:14px;
      font-weight:800;
      cursor:pointer;
      transition:0.2s;
    }
    .btn-cfg-main:active{
      transform:scale(0.98);
      background:#00d4d4;
      color:#0f0f11;
    }
    
    /* ── BOTÓN SETUP ── */
    .btn-setup{
      width:100%;
      background:#c0392b;
      color:white;
      border:none;
      border-radius:20px;
      padding:26px;
      font-size:22px;
      font-weight:900;
      letter-spacing:1px;
      cursor:pointer;
      transition:0.15s;
    }
    .btn-setup:active{ transform:scale(0.97); background:#96281b; }
    .btn-setup:disabled{ background:#444; cursor:not-allowed; }
 
    /* ── PANTALLA ENVIADO ── */
    .enviado{
      display:none;
      flex-direction:column;
      align-items:center;
      text-align:center;
      width:100%;
      max-width:380px;
      animation: fadeIn 0.4s ease;
    }
    .enviado.visible{ display:flex; }
    @keyframes fadeIn{ from{opacity:0;transform:scale(0.9)} to{opacity:1;transform:scale(1)} }
    .enviado-icono{ font-size:90px; margin-bottom:24px; }
    .enviado-titulo{ font-size:28px; font-weight:900; color:#2ecc71; margin-bottom:10px; }
    .enviado-sub{ font-size:16px; color:#888; margin-bottom:40px; line-height:1.5; }
    .btn-volver{
      background:#1a1a1e;
      color:#00d4d4;
      border:1px solid #00d4d4;
      border-radius:50px;
      padding:14px 40px;
      font-size:16px;
      font-weight:800;
      cursor:pointer;
      transition:0.2s;
    }
    .btn-volver:active{
      transform:scale(0.98);
      background:#00d4d4;
      color:#0f0f11;
    }
 
    /* ── PANTALLA ERROR ── */
    .error-msg{
      color:#e74c3c;
      font-size:13px;
      margin-top:10px;
      min-height:18px;
      font-weight:600;
    }
 
    /* ── CONFIG OCULTA ── */
    .cfg-link{
      position:fixed;
      bottom:16px;
      right:16px;
      font-size:16px;
      color:#666;
      cursor:pointer;
      letter-spacing:2px;
      padding:10px;
      user-select:none;
      -webkit-user-select:none;
      touch-action:manipulation;
      z-index:50;
    }
    .cfg-link:hover{ color:#999; }
    
    .cfg-panel{
      display:none;
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.95);
      z-index:200;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      padding:24px;
    }
    .cfg-panel.visible{ display:flex; }
    .cfg-content{
      width:100%;
      max-width:400px;
      text-align:center;
    }
    .cfg-title{
      font-size:18px;
      font-weight:900;
      margin-bottom:24px;
      color:#fff;
    }
    .cfg-input{
      width:100%;
      background:#24242a;
      border:2px solid #2e2e38;
      border-radius:12px;
      padding:16px;
      color:white;
      font-size:14px;
      outline:none;
      margin-bottom:12px;
    }
    .cfg-input:focus{
      border-color:#4a90e2;
    }
    .cfg-btn{
      width:100%;
      background:#4a90e2;
      color:white;
      border:none;
      border-radius:12px;
      padding:16px;
      font-weight:800;
      font-size:16px;
      cursor:pointer;
      margin-bottom:10px;
      transition:0.2s;
    }
    .cfg-btn:active{
      transform:scale(0.98);
      background:#357abd;
    }
    .cfg-cerrar{
      color:#888;
      font-size:13px;
      cursor:pointer;
      margin-top:6px;
      transition:0.2s;
    }
    .cfg-cerrar:hover{
      color:#bbb;
    }
 
    .cfg-reset-btn{
      width:100%;
      background:#e74c3c;
      color:white;
      border:none;
      border-radius:12px;
      padding:12px;
      font-weight:700;
      font-size:14px;
      cursor:pointer;
      margin-top:20px;
      margin-bottom:10px;
      transition:0.2s;
    }
    .cfg-reset-btn:active{
      transform:scale(0.98);
      background:#c0392b;
    }
  </style>
</head>
<body>
 
<!-- ── PANTALLA SETUP (CONFIGURACIÓN INICIAL) ────────────── -->
<div class="pantalla" id="pantalla-setup">
  <div class="logo">NEXOS · VECINOS</div>
 
  <div class="form-box">
    <div class="setup-title">⚙️ CONFIGURACIÓN</div>
    <div class="setup-subtitle">Ingresa tu ubicación una sola vez</div>
    <input class="campo" id="setup-mza"  type="number" placeholder="N° Manzana" inputmode="numeric">
    <input class="campo" id="setup-casa" type="number" placeholder="N° Casa" inputmode="numeric">
    <div class="error-msg" id="setup-error"></div>
  </div>
 
  <button class="btn-setup" onclick="guardarSetup()">
    ✅&nbsp;&nbsp;CONFIRMAR
  </button>
</div>
 
<!-- ── PANTALLA PÁNICO (BOTÓN REDONDO) ──────────────────── -->
<div class="pantalla-panico" id="pantalla-panico">
  <div class="logo">NEXOS · VECINOS</div>
  
  <div class="info-config">
    Configurado: <strong id="config-display"></strong>
  </div>
 
  <div class="boton-redondo-container">
    <button class="boton-redondo" id="btn-panico-redondo" onclick="enviarPanico()">
      <span>🆘</span>
      <span class="boton-texto">EMERGENCIA</span>
    </button>
  </div>
  
  <button class="btn-cfg-main" onclick="abrirCfg()">⚙️ Cambiar ubicación</button>
</div>
 
<!-- ── PANTALLA CONFIRMACIÓN ─────────────────────────────── -->
<div class="enviado" id="pantalla-enviado">
  <div class="enviado-icono">✅</div>
  <div class="enviado-titulo">¡ALERTA ENVIADA!</div>
  <div class="enviado-sub">El vigilador fue notificado.<br>Quedate tranquilo, ya están al tanto.</div>
  <button class="btn-volver" onclick="volverAlPanico()">Volver</button>
</div>
 
<!-- ── CONFIG OCULTA (puntos) ────────────────────────────── -->
<div class="cfg-link" id="cfg-link">···</div>
 
<div class="cfg-panel" id="cfg-panel">
  <div class="cfg-content">
    <div class="cfg-title">⚙️ CONFIGURACIÓN</div>
    <input class="cfg-input" id="cfg-url" placeholder="URL del script /exec">
    <button class="cfg-btn" onclick="guardarCfg()">GUARDAR URL</button>
    <button class="cfg-reset-btn" onclick="resetearApp()">🔄 Cambiar ubicación</button>
    <div class="cfg-cerrar" onclick="cerrarCfg()">Cerrar</div>
  </div>
</div>
 
<script>
  // ─── Inicialización ───────────────────────────────────────
  function inicializar() {
    const mza = localStorage.getItem('nx_manzana');
    const casa = localStorage.getItem('nx_casa');
    
    if (mza && casa) {
      // Ya está configurado, mostrar pantalla de pánico
      mostrarPantallaPanico();
    } else {
      // Mostrar setup
      mostrarSetup();
    }
  }
 
  function mostrarSetup() {
    document.getElementById('pantalla-setup').classList.add('visible');
    document.getElementById('pantalla-panico').classList.remove('visible');
    document.getElementById('pantalla-enviado').classList.remove('visible');
  }
 
  function mostrarPantallaPanico() {
    const mza = localStorage.getItem('nx_manzana');
    const casa = localStorage.getItem('nx_casa');
    document.getElementById('config-display').innerText = `Mz. ${mza} Casa ${casa}`;
    
    document.getElementById('pantalla-setup').classList.remove('visible');
    document.getElementById('pantalla-panico').classList.add('visible');
    document.getElementById('pantalla-enviado').classList.remove('visible');
  }
 
  function guardarSetup() {
    const mza = document.getElementById('setup-mza').value.trim();
    const casa = document.getElementById('setup-casa').value.trim();
    const err = document.getElementById('setup-error');
    
    err.innerText = '';
    
    if (!mza || !casa) {
      err.innerText = 'Completá manzana y casa';
      return;
    }
    
    localStorage.setItem('nx_manzana', mza);
    localStorage.setItem('nx_casa', casa);
    
    mostrarPantallaPanico();
  }
 
  // ─── Envío de pánico ──────────────────────────────────────
  async function enviarPanico() {
    const mza = localStorage.getItem('nx_manzana');
    const casa = localStorage.getItem('nx_casa');
    const url = localStorage.getItem('nx_panico_url');
    const btn = document.getElementById('btn-panico-redondo');
 
    if (!url) {
      alert('⚠️ URL no configurada.\n\nPresiona los 3 puntos (···) abajo a la derecha para configurar.');
      return;
    }
 
    btn.disabled = true;
    btn.innerHTML = '<span>⏳</span><span class="boton-texto">Enviando...</span>';
 
    try {
      await fetch(url, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ accion: 'panico', mza: mza, casa: casa })
      });
      
      document.getElementById('pantalla-panico').classList.remove('visible');
      document.getElementById('pantalla-enviado').classList.add('visible');
    } catch(e) {
      alert('Error de red. Intentá de nuevo.');
      btn.disabled = false;
      btn.innerHTML = '<span>🆘</span><span class="boton-texto">EMERGENCIA</span>';
    }
  }
 
  function volverAlPanico() {
    document.getElementById('pantalla-enviado').classList.remove('visible');
    document.getElementById('pantalla-panico').classList.add('visible');
    
    const btn = document.getElementById('btn-panico-redondo');
    btn.disabled = false;
    btn.innerHTML = '<span>🆘</span><span class="boton-texto">EMERGENCIA</span>';
  }
 
  function abrirCfg() {
    document.getElementById('cfg-url').value = localStorage.getItem('nx_panico_url') || '';
    document.getElementById('cfg-panel').classList.add('visible');
  }
 
  // ─── Config oculta (presión larga 1.5s) ────────────────
  let presionTimer = null;
  
  document.getElementById('cfg-link').addEventListener('touchstart', iniciarPresion, false);
  document.getElementById('cfg-link').addEventListener('touchend', cancelarPresion, false);
  document.getElementById('cfg-link').addEventListener('touchcancel', cancelarPresion, false);
  document.getElementById('cfg-link').addEventListener('mousedown', iniciarPresion, false);
  document.getElementById('cfg-link').addEventListener('mouseup', cancelarPresion, false);
  document.getElementById('cfg-link').addEventListener('mouseleave', cancelarPresion, false);
  
  function iniciarPresion() {
    presionTimer = setTimeout(() => {
      abrirCfg();
    }, 1500);
  }
  
  function cancelarPresion() { 
    clearTimeout(presionTimer); 
  }
  
  function guardarCfg() {
    const urlGuardada = document.getElementById('cfg-url').value.trim();
    if (!urlGuardada) {
      alert('Por favor ingresa una URL válida');
      return;
    }
    localStorage.setItem('nx_panico_url', urlGuardada);
    cerrarCfg();
    alert('✅ URL guardada correctamente');
  }
  
  function cerrarCfg() {
    document.getElementById('cfg-panel').classList.remove('visible');
  }
 
  function resetearApp() {
    if (confirm('¿Estás seguro que querés cambiar la ubicación?\n\nTendrás que configurar manzana y casa nuevamente.')) {
      localStorage.removeItem('nx_manzana');
      localStorage.removeItem('nx_casa');
      cerrarCfg();
      inicializar();
    }
  }
  
  // ─── Iniciar al cargar ────────────────────────────────────
  window.addEventListener('DOMContentLoaded', inicializar);
</script>
</body>
</html>
