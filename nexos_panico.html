<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>NEXOS — EMERGENCIA</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
    body{
      background:#0f0f11;
      color:white;
      font-family:-apple-system,system-ui,sans-serif;
      min-height:100dvh;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      padding:24px;
      user-select:none;
    }
 
    /* ── PANTALLA INICIAL ── */
    .pantalla{ width:100%; max-width:380px; text-align:center; }
    .logo{ font-size:13px; letter-spacing:4px; color:#555; margin-bottom:40px; }
 
    .form-box{
      background:#1a1a1e;
      border:1px solid #2e2e38;
      border-radius:24px;
      padding:28px 24px;
      margin-bottom:24px;
    }
    .form-title{ font-size:15px; color:#888; letter-spacing:2px; margin-bottom:20px; }
    .campo{
      width:100%;
      background:#24242a;
      border:2px solid #2e2e38;
      border-radius:14px;
      padding:20px;
      color:white;
      font-size:28px;
      font-weight:700;
      text-align:center;
      outline:none;
      margin-bottom:12px;
      -moz-appearance:textfield;
    }
    .campo::placeholder{ color:#444; font-size:18px; font-weight:400; }
    .campo:focus{ border-color:#e74c3c; }
 
    /* ── BOTÓN PÁNICO ── */
    .btn-panico{
      width:100%;
      background:#c0392b;
      color:white;
      border:none;
      border-radius:20px;
      padding:26px;
      font-size:22px;
      font-weight:900;
      letter-spacing:1px;
      cursor:pointer;
      transition:0.15s;
      position:relative;
      overflow:hidden;
    }
    .btn-panico:active{ transform:scale(0.97); background:#96281b; }
    .btn-panico:disabled{ background:#444; cursor:not-allowed; }
 
    /* ── PANTALLA ENVIADO ── */
    .enviado{
      display:none;
      flex-direction:column;
      align-items:center;
      text-align:center;
      animation: fadeIn 0.4s ease;
    }
    .enviado.visible{ display:flex; }
    @keyframes fadeIn{ from{opacity:0;transform:scale(0.9)} to{opacity:1;transform:scale(1)} }
    .enviado-icono{ font-size:90px; margin-bottom:24px; }
    .enviado-titulo{ font-size:28px; font-weight:900; color:#2ecc71; margin-bottom:10px; }
    .enviado-sub{ font-size:16px; color:#888; margin-bottom:40px; line-height:1.5; }
    .btn-volver{
      background:#1a1a1e;
      color:#00d4d4;
      border:1px solid #00d4d4;
      border-radius:50px;
      padding:14px 40px;
      font-size:16px;
      font-weight:800;
      cursor:pointer;
    }
 
    /* ── PANTALLA ERROR ── */
    .error-msg{
      color:#e74c3c;
      font-size:13px;
      margin-top:10px;
      min-height:18px;
      font-weight:600;
    }
 
    /* ── CONFIG OCULTA ── */
    .cfg-link{
      position:fixed;
      bottom:16px;
      right:16px;
      font-size:16px;
      color:#666;
      cursor:pointer;
      letter-spacing:2px;
      padding:10px;
      user-select:none;
      -webkit-user-select:none;
      touch-action:manipulation;
      z-index:50;
    }
    .cfg-link:hover{ color:#999; }
    
    .cfg-panel{
      display:none;
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.95);
      z-index:200;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      padding:24px;
    }
    .cfg-panel.visible{ display:flex; }
    .cfg-content{
      width:100%;
      max-width:400px;
      text-align:center;
    }
    .cfg-title{
      font-size:18px;
      font-weight:900;
      margin-bottom:24px;
      color:#fff;
    }
    .cfg-input{
      width:100%;
      background:#24242a;
      border:2px solid #2e2e38;
      border-radius:12px;
      padding:16px;
      color:white;
      font-size:14px;
      outline:none;
      margin-bottom:12px;
    }
    .cfg-input:focus{
      border-color:#4a90e2;
    }
    .cfg-btn{
      width:100%;
      background:#4a90e2;
      color:white;
      border:none;
      border-radius:12px;
      padding:16px;
      font-weight:800;
      font-size:16px;
      cursor:pointer;
      margin-bottom:10px;
      transition:0.2s;
    }
    .cfg-btn:active{
      transform:scale(0.98);
      background:#357abd;
    }
    .cfg-cerrar{
      color:#888;
      font-size:13px;
      cursor:pointer;
      margin-top:6px;
      transition:0.2s;
    }
    .cfg-cerrar:hover{
      color:#bbb;
    }
  </style>
</head>
<body>
 
<!-- ── PANTALLA PRINCIPAL ────────────────────────────────── -->
<div class="pantalla" id="pantalla-form">
  <div class="logo">NEXOS · VECINOS</div>
 
  <div class="form-box">
    <div class="form-title">¿DÓNDE NECESITÁS AYUDA?</div>
    <input class="campo" id="mza"  type="number" placeholder="N° Manzana" inputmode="numeric">
    <input class="campo" id="casa" type="number" placeholder="N° Casa"    inputmode="numeric">
    <div class="error-msg" id="error-msg"></div>
  </div>
 
  <button class="btn-panico" id="btn-panico" onclick="enviarPanico()">
    🆘&nbsp;&nbsp;PEDIR AYUDA
  </button>
</div>
 
<!-- ── PANTALLA CONFIRMACIÓN ─────────────────────────────── -->
<div class="enviado" id="pantalla-enviado">
  <div class="enviado-icono">✅</div>
  <div class="enviado-titulo">¡ALERTA ENVIADA!</div>
  <div class="enviado-sub">El vigilador fue notificado.<br>Quedate tranquilo, ya están al tanto.</div>
  <button class="btn-volver" onclick="volver()">Enviar otra alerta</button>
</div>
 
<!-- ── CONFIG OCULTA (toque largo en el logo) ────────────── -->
<div class="cfg-link" id="cfg-link">···</div>
 
<div class="cfg-panel" id="cfg-panel">
  <div class="cfg-content">
    <div class="cfg-title">⚙️ CONFIGURACIÓN</div>
    <input class="cfg-input" id="cfg-url" placeholder="URL del script /exec">
    <button class="cfg-btn" onclick="guardarCfg()">GUARDAR URL</button>
    <div class="cfg-cerrar" onclick="cerrarCfg()">Cerrar</div>
  </div>
</div>
 
<script>
  // ─── Envío de pánico ──────────────────────────────────────
  async function enviarPanico() {
    const mza  = document.getElementById('mza').value.trim();
    const casa = document.getElementById('casa').value.trim();
    const url  = localStorage.getItem('nx_panico_url');
    const err  = document.getElementById('error-msg');
    const btn  = document.getElementById('btn-panico');
 
    err.innerText = '';
 
    if (!mza || !casa) { err.innerText = 'Completá manzana y casa'; return; }
    if (!url) { err.innerText = 'Sin URL configurada — presioná ··· abajo a la derecha'; return; }
 
    btn.disabled = true;
    btn.innerText = '⏳  Enviando...';
 
    try {
      await fetch(url, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ accion: 'panico', mza: mza, casa: casa })
      });
      // Con no-cors no podemos leer la respuesta, pero el servidor la recibe
      document.getElementById('pantalla-form').style.display   = 'none';
      document.getElementById('pantalla-enviado').classList.add('visible');
    } catch(e) {
      err.innerText = 'Error de red. Intentá de nuevo.';
      btn.disabled  = false;
      btn.innerText = '🆘  PEDIR AYUDA';
    }
  }
 
  function volver() {
    document.getElementById('mza').value  = '';
    document.getElementById('casa').value = '';
    document.getElementById('pantalla-form').style.display = 'flex';
    document.getElementById('pantalla-enviado').classList.remove('visible');
    document.getElementById('btn-panico').disabled = false;
    document.getElementById('btn-panico').innerText = '🆘\u00a0\u00a0PEDIR AYUDA';
  }
 
  // ─── Config oculta (presión larga 1.5s) ────────────────
  let presionTimer = null;
  
  document.getElementById('cfg-link').addEventListener('touchstart', iniciarPresion, false);
  document.getElementById('cfg-link').addEventListener('touchend', cancelarPresion, false);
  document.getElementById('cfg-link').addEventListener('touchcancel', cancelarPresion, false);
  document.getElementById('cfg-link').addEventListener('mousedown', iniciarPresion, false);
  document.getElementById('cfg-link').addEventListener('mouseup', cancelarPresion, false);
  document.getElementById('cfg-link').addEventListener('mouseleave', cancelarPresion, false);
  
  function iniciarPresion() {
    presionTimer = setTimeout(() => {
      document.getElementById('cfg-url').value = localStorage.getItem('nx_panico_url') || '';
      document.getElementById('cfg-panel').classList.add('visible');
    }, 1500);
  }
  
  function cancelarPresion() { 
    clearTimeout(presionTimer); 
  }
  
  function guardarCfg() {
    const urlGuardada = document.getElementById('cfg-url').value.trim();
    if (!urlGuardada) {
      alert('Por favor ingresa una URL válida');
      return;
    }
    localStorage.setItem('nx_panico_url', urlGuardada);
    cerrarCfg();
  }
  
  function cerrarCfg() {
    document.getElementById('cfg-panel').classList.remove('visible');
  }
</script>
</body>
</html>
