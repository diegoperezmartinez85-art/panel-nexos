<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>Altos de Podestá</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#050805">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Jost:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#050805;
  --bg2:#0a100a;
  --bg3:#101810;
  --card:#0d140d;
  --border:rgba(255,255,255,0.055);
  --border2:rgba(255,255,255,0.10);
  --text:#deeada;
  --muted:#4a5e4c;
  --muted2:#7a977c;
  --gold:#c8a84e;
  --gold2:#e4cc78;
  --gneon:#3dff6e;
  --gglow:rgba(61,255,110,0.5);
  --accent:#8fcf94;
  --card-hover:rgba(61,255,110,0.04);
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Jost',sans-serif;overflow:hidden;}

/* AMBIENT BG */
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 80% 60% at 0% 0%,rgba(61,255,110,0.055) 0%,transparent 50%),
    radial-gradient(ellipse 70% 80% at 100% 100%,rgba(196,168,76,0.055) 0%,transparent 50%),
    radial-gradient(ellipse 60% 60% at 50% 40%,rgba(61,255,110,0.02) 0%,transparent 60%);
}

/* ══════════════════════════════════
   HEADER — Elegante, bien espaciado
══════════════════════════════════ */
.hdr{
  position:fixed;top:0;left:0;right:0;z-index:100;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 20px 14px;
  display:flex;align-items:center;gap:14px;
  background:linear-gradient(180deg,rgba(5,8,5,0.97) 0%,rgba(5,8,5,0.88) 100%);
  backdrop-filter:blur(30px) saturate(1.8);
  -webkit-backdrop-filter:blur(30px) saturate(1.8);
  border-bottom:1px solid var(--border);
}

/* Logo neon verde */
.hdr-logo{
  width:48px;height:48px;border-radius:50%;overflow:hidden;flex-shrink:0;
  box-shadow:
    0 0 0 1.5px rgba(57,255,20,0.9),
    0 0 12px 3px rgba(57,255,20,0.7),
    0 0 30px 8px rgba(57,255,20,0.35),
    0 0 60px 18px rgba(57,255,20,0.12);
  animation:gn 3.5s ease-in-out infinite;
}
.hdr-logo img{width:100%;height:100%;object-fit:cover;display:block;}
@keyframes gn{
  0%,100%{box-shadow:0 0 0 1.5px rgba(57,255,20,0.9),0 0 12px 3px rgba(57,255,20,0.7),0 0 30px 8px rgba(57,255,20,0.35),0 0 60px 18px rgba(57,255,20,0.12);}
  50%{box-shadow:0 0 0 2px rgba(57,255,20,1),0 0 20px 5px rgba(57,255,20,0.95),0 0 50px 14px rgba(57,255,20,0.55),0 0 100px 30px rgba(57,255,20,0.2);}
}

/* Título */
.hdr-info{flex:1;min-width:0;}
.hdr-name{
  font-family:'Playfair Display',serif;
  font-size:18px;font-weight:700;
  color:var(--gold);
  letter-spacing:0.5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  text-shadow:0 0 30px rgba(200,168,78,0.3);
}
.hdr-sub{
  font-size:8px;font-weight:300;
  color:var(--muted);
  letter-spacing:4px;text-transform:uppercase;
  margin-top:3px;
}

/* Clima + hora — MÁS GRANDE Y ELEGANTE */
.hdr-right{
  display:flex;flex-direction:column;
  align-items:flex-end;gap:4px;flex-shrink:0;
}
.hdr-clock-row{display:flex;align-items:center;gap:8px;}

.hdr-wico{
  font-size:24px;line-height:1;
  filter:drop-shadow(0 0 6px rgba(255,255,255,0.3));
}
.hdr-clock{
  font-family:'Jost',sans-serif;
  font-size:26px;font-weight:300;
  color:var(--gneon);
  letter-spacing:3px;
  font-variant-numeric:tabular-nums;
  text-shadow:0 0 14px rgba(61,255,110,0.8),0 0 32px rgba(61,255,110,0.3);
  line-height:1;
}
.hdr-temp-row{display:flex;align-items:center;gap:6px;justify-content:flex-end;}
.hdr-temp{
  font-size:16px;font-weight:300;
  color:var(--gold);
  letter-spacing:1px;
  text-shadow:0 0 12px rgba(200,168,78,0.5);
}
.hdr-badge{
  display:flex;align-items:center;gap:5px;
  background:rgba(61,255,110,0.06);
  border:1px solid rgba(61,255,110,0.18);
  border-radius:20px;padding:3px 9px;
  font-size:9px;font-weight:400;
  color:rgba(61,255,110,0.8);
  letter-spacing:1.5px;
}
.bdot{width:4px;height:4px;border-radius:50%;background:var(--gneon);box-shadow:0 0 5px var(--gglow);animation:blink 2.5s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.15}}

/* Nexos sutil — neon azul */
.hdr-nexos{
  width:34px;height:34px;border-radius:9px;overflow:hidden;flex-shrink:0;
  box-shadow:
    0 0 0 1.5px rgba(0,180,255,0.9),
    0 0 8px 2px rgba(0,180,255,0.65),
    0 0 20px 5px rgba(0,180,255,0.3),
    0 0 40px 10px rgba(0,180,255,0.1);
  animation:rneon 3s ease-in-out infinite;
  opacity:0.85;
  text-decoration:none;display:block;
}
.hdr-nexos img{width:100%;height:100%;object-fit:cover;display:block;}
@keyframes rneon{
  0%,100%{box-shadow:0 0 0 1.5px rgba(0,180,255,0.9),0 0 8px 2px rgba(0,180,255,0.65),0 0 20px 5px rgba(0,180,255,0.3),0 0 40px 10px rgba(0,180,255,0.1);}
  50%{box-shadow:0 0 0 2px rgba(0,180,255,1),0 0 14px 4px rgba(0,180,255,0.9),0 0 36px 9px rgba(0,180,255,0.5),0 0 70px 18px rgba(0,180,255,0.18);}
}

/* ══════════════════════════════════
   MAIN
══════════════════════════════════ */
.main{
  position:fixed;inset:0;z-index:1;
  /* Espacio extra arriba para separar pills del header */
  padding-top:calc(env(safe-area-inset-top,0px) + 90px);
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 8px);
  display:flex;flex-direction:column;overflow:hidden;
}

/* ── SEARCH ── */
.srch-section{padding:18px 18px 0;flex-shrink:0;}
.srch-box{position:relative;display:flex;align-items:center;}
.srch-ico{position:absolute;left:16px;font-size:14px;color:var(--muted);pointer-events:none;}
.srch-input{
  width:100%;
  background:rgba(255,255,255,0.03);
  border:1px solid var(--border2);
  border-radius:18px;
  padding:14px 42px 14px 44px;
  color:var(--text);
  font-family:'Jost',sans-serif;font-size:15px;font-weight:300;
  outline:none;-webkit-appearance:none;
  transition:border-color 0.25s,box-shadow 0.25s,background 0.25s;
}
.srch-input::placeholder{color:var(--muted);font-weight:300;letter-spacing:0.5px;}
.srch-input:focus{
  background:rgba(255,255,255,0.05);
  border-color:rgba(61,255,110,0.35);
  box-shadow:0 0 0 3px rgba(61,255,110,0.06),0 8px 30px rgba(0,0,0,0.3);
}
.srch-clr{position:absolute;right:14px;background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer;display:none;padding:5px;line-height:1;transition:color 0.2s;}
.srch-clr.on{display:block;}
.srch-clr:hover{color:var(--text);}

/* ── PILLS — CON SEPARACIÓN DEL BUSCADOR ── */
.pills-section{padding:14px 18px 0;flex-shrink:0;}
.pills{
  display:flex;gap:7px;
  overflow-x:auto;
  padding-bottom:2px;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
.pills::-webkit-scrollbar{display:none;}
.pill{
  background:transparent;
  border:1px solid var(--border2);
  border-radius:22px;
  padding:7px 15px;
  font-size:11px;font-weight:400;
  color:var(--muted2);
  cursor:pointer;white-space:nowrap;
  transition:all 0.2s;flex-shrink:0;
  letter-spacing:0.5px;
}
.pill:active,.pill.active{
  background:rgba(61,255,110,0.1);
  border-color:rgba(61,255,110,0.45);
  color:var(--gneon);
  box-shadow:0 0 12px rgba(61,255,110,0.15);
}

/* ── STATS + TOGGLE ── */
.stats-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 18px 10px;flex-shrink:0;
}
.stats-txt{font-size:11px;font-weight:300;color:var(--muted);letter-spacing:0.5px;}
.stats-txt span{color:var(--gold2);font-weight:400;}
.vtoggle{display:flex;gap:3px;background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:10px;padding:3px;}
.vbtn{background:transparent;border:none;border-radius:7px;padding:5px 9px;font-size:14px;cursor:pointer;color:var(--muted);transition:all 0.18s;}
.vbtn.active{background:rgba(61,255,110,0.12);color:var(--gneon);}

/* ── GRID WRAP ── */
.grid-wrap{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 14px 20px;-webkit-overflow-scrolling:touch;}
.grid-wrap::-webkit-scrollbar{display:none;}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;}
.grid.list{grid-template-columns:1fr;gap:6px;}

/* ── CARD GRID ── */
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  aspect-ratio:1;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;overflow:hidden;position:relative;
  transition:transform 0.15s cubic-bezier(0.4,0,0.2,1),border-color 0.2s,box-shadow 0.2s,background 0.2s;
  animation:cin 0.2s ease both;
}
@keyframes cin{from{opacity:0;transform:scale(0.82) translateY(4px)}to{opacity:1;transform:scale(1) translateY(0)}}
.card::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% -10%,rgba(61,255,110,0.1) 0%,transparent 65%);
  opacity:0;transition:opacity 0.2s;
}
.card:active{transform:scale(0.89);border-color:rgba(61,255,110,0.5);box-shadow:0 0 24px rgba(61,255,110,0.18),inset 0 0 20px rgba(61,255,110,0.04);}
.card:active::before{opacity:1;}
.card.hide{display:none;}

.c-lbl{font-size:8px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;font-weight:300;margin-bottom:1px;}
.c-num{font-family:'Playfair Display',serif;font-size:26px;font-weight:700;color:var(--text);line-height:1.1;}
.c-dot{width:4px;height:4px;border-radius:50%;background:rgba(61,255,110,0.4);margin-top:5px;box-shadow:0 0 6px rgba(61,255,110,0.5);}

/* Estrella favorito */
.fav-btn{
  position:absolute;top:6px;right:7px;
  font-size:11px;opacity:0.22;cursor:pointer;z-index:2;
  transition:opacity 0.2s,transform 0.2s;line-height:1;
  background:none;border:none;padding:3px;
}
.fav-btn.on{opacity:1;}
.fav-btn:active{transform:scale(1.3);}

/* ── CARD LIST ── */
.grid.list .card{
  aspect-ratio:unset;flex-direction:row;justify-content:flex-start;
  padding:16px 18px;gap:16px;border-radius:16px;
}
.grid.list .c-lbl{display:none;}
.grid.list .c-num{font-size:22px;min-width:36px;}
.grid.list .c-dot{display:none;}
.list-info{display:none;flex:1;}
.grid.list .list-info{display:flex;flex-direction:column;justify-content:center;gap:2px;}
.list-addr{font-size:12px;color:var(--muted2);font-weight:300;letter-spacing:0.3px;}
.list-coords{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums;font-family:monospace;}
.list-arr{display:none;color:var(--muted);font-size:18px;margin-left:auto;flex-shrink:0;}
.grid.list .list-arr{display:block;}

/* Empty */
.empty{display:none;flex-direction:column;align-items:center;justify-content:center;padding:70px 20px;gap:12px;text-align:center;}
.empty.on{display:flex;}
.empty-i{font-size:44px;opacity:0.15;}
.empty-t{font-size:13px;color:var(--muted);font-weight:300;letter-spacing:1px;}

/* Instagram — sutil pero visible */
.ig-bar{
  display:flex;align-items:center;gap:8px;
  margin:0 18px;
  padding:8px 14px;
  background:rgba(255,255,255,0.03);
  border:1px solid rgba(188,24,136,0.2);
  border-radius:12px;
  text-decoration:none;
  transition:all 0.2s;
  flex-shrink:0;
}
.ig-bar:active{background:rgba(220,39,67,0.08);transform:scale(0.98);}
.ig-icon{
  width:20px;height:20px;flex-shrink:0;
  background:linear-gradient(135deg,#f09433,#dc2743,#bc1888);
  border-radius:6px;display:flex;align-items:center;justify-content:center;
}
.ig-handle{font-size:12px;font-weight:400;color:var(--muted2);letter-spacing:0.5px;}
.ig-arrow{color:var(--muted);font-size:13px;margin-left:auto;opacity:0.6;}

/* ══════════════════════════════════
   MODAL BOTTOM SHEET
══════════════════════════════════ */
.ov{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,0.82);z-index:500;
  align-items:flex-end;justify-content:center;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
.ov.on{display:flex;}

.sheet{
  background:linear-gradient(180deg,#0e160e 0%,#080d08 100%);
  border-radius:28px 28px 0 0;
  width:100%;max-width:520px;
  padding:0 22px calc(env(safe-area-inset-bottom,0px)+30px);
  border-top:1px solid rgba(61,255,110,0.12);
  box-shadow:0 -20px 60px rgba(0,0,0,0.7),0 -1px 0 rgba(61,255,110,0.06);
  transform:translateY(100%);
  transition:transform 0.38s cubic-bezier(0.32,0.72,0,1);
}
.ov.on .sheet{transform:translateY(0);}

.handle{width:34px;height:3px;background:rgba(255,255,255,0.1);border-radius:2px;margin:14px auto 22px;}

/* Sheet número */
.s-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:20px;}
.s-left{}
.s-eyebrow{font-size:9px;font-weight:500;color:var(--muted);letter-spacing:5px;text-transform:uppercase;margin-bottom:4px;}
.s-num{
  font-family:'Playfair Display',serif;
  font-size:64px;font-weight:900;
  color:var(--text);line-height:0.95;
  text-shadow:0 0 40px rgba(255,255,255,0.1);
}
.s-addr{font-size:12px;color:var(--muted2);font-style:italic;letter-spacing:0.5px;margin-top:6px;}

/* GPS badge */
.s-gps{
  display:flex;flex-direction:column;align-items:center;gap:4px;
  background:rgba(61,255,110,0.06);
  border:1px solid rgba(61,255,110,0.18);
  border-radius:16px;padding:12px 14px;
  margin-bottom:4px;
}
.s-gps-ico{font-size:24px;}
.s-gps-txt{font-size:8px;color:var(--gneon);letter-spacing:2px;font-weight:500;text-transform:uppercase;}

/* Divider con glow */
.s-div{
  height:1px;
  background:linear-gradient(90deg,transparent,rgba(61,255,110,0.15),rgba(196,168,76,0.15),rgba(61,255,110,0.15),transparent);
  margin:18px 0;
}

/* Coords */
.coords{
  display:flex;justify-content:space-around;align-items:center;
  background:rgba(255,255,255,0.025);
  border:1px solid var(--border);
  border-radius:16px;padding:16px;margin-bottom:20px;
}
.cg{text-align:center;}
.cl{font-size:8px;color:var(--muted);letter-spacing:2.5px;text-transform:uppercase;margin-bottom:5px;}
.cv{font-size:13px;font-weight:400;color:var(--accent);font-variant-numeric:tabular-nums;font-family:monospace;}
.csep{width:1px;height:36px;background:var(--border2);}

/* Botones navegación */
.nav-btns{display:flex;flex-direction:column;gap:10px;}

.bmaps{
  width:100%;
  background:linear-gradient(135deg,#145c20 0%,#1e7f2e 60%,#25923a 100%);
  border:none;border-radius:18px;padding:19px;
  color:white;font-family:'Jost',sans-serif;font-size:15px;font-weight:500;letter-spacing:0.5px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:11px;
  box-shadow:0 6px 24px rgba(20,92,32,0.45),0 1px 0 rgba(255,255,255,0.1) inset;
  transition:transform 0.15s,opacity 0.15s;
}
.bmaps:active{transform:scale(0.97);opacity:0.88;}

.bwaze{
  width:100%;
  background:linear-gradient(135deg,#004dc0 0%,#0062e8 100%);
  border:none;border-radius:18px;padding:17px;
  color:white;font-family:'Jost',sans-serif;font-size:14px;font-weight:400;letter-spacing:0.3px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;
  box-shadow:0 4px 18px rgba(0,77,192,0.35);
  transition:transform 0.15s,opacity 0.15s;
}
.bwaze:active{transform:scale(0.97);opacity:0.88;}

.bcancel{
  width:100%;background:transparent;
  border:1px solid rgba(255,255,255,0.08);
  border-radius:18px;padding:15px;
  color:var(--muted2);font-family:'Jost',sans-serif;font-size:14px;font-weight:300;
  cursor:pointer;letter-spacing:0.5px;
  transition:background 0.15s,color 0.15s;
}
.bcancel:active{background:rgba(255,255,255,0.04);color:var(--text);}

@media(max-width:360px){.grid:not(.list){grid-template-columns:repeat(3,1fr);}.c-num{font-size:22px;}.hdr-clock{font-size:22px;}}
@media(min-width:500px){.grid:not(.list){grid-template-columns:repeat(5,1fr);}}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-logo"><img id="hlogo" alt=""></div>
  <div class="hdr-info">
    <div class="hdr-name">Altos de Podestá</div>
    <div class="hdr-sub">Navigator · Lotes</div>
  </div>
  <a class="hdr-nexos" href="https://nexosmaps.com" target="_blank" rel="noopener"><img id="nexosImg" alt="Nexos"></a>
  <div class="hdr-right">
    <div class="hdr-clock-row">
      <span class="hdr-wico" id="wico">🌤️</span>
      <span class="hdr-clock" id="hclock">--:--</span>
    </div>
    <div class="hdr-temp-row">
      <span class="hdr-temp" id="wtemp">--°</span>
      <div class="hdr-badge"><div class="bdot"></div><span id="bcnt">86</span></div>
    </div>
  </div>
</header>

<main class="main">
  <div class="srch-section">
    <div class="srch-box">
      <span class="srch-ico">🔍</span>
      <input class="srch-input" id="srch" type="number" inputmode="numeric" placeholder="Buscar lote..." autocomplete="off">
      <button class="srch-clr" id="srchClr">✕</button>
    </div>
  </div>

  <div class="pills-section">
    <div class="pills" id="pills">
      <div class="pill active" data-range="all">Todos</div>
      <div class="pill" data-range="1-20">1 – 20</div>
      <div class="pill" data-range="21-40">21 – 40</div>
      <div class="pill" data-range="41-60">41 – 60</div>
      <div class="pill" data-range="61-80">61 – 80</div>
      <div class="pill" data-range="81-99">81 – 99</div>
      <div class="pill" data-range="fav">⭐ Favoritos</div>
    </div>
  </div>

  <a class="ig-bar" href="https://www.instagram.com/nexosmaps?utm_source=ig_web_button_share_sheet&igsh=ZDNlZDc0MzIxNw==" target="_blank" rel="noopener">
    <div class="ig-icon">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none">
        <rect x="2" y="2" width="20" height="20" rx="5" stroke="white" stroke-width="2"/>
        <circle cx="12" cy="12" r="4" stroke="white" stroke-width="2"/>
        <circle cx="17.5" cy="6.5" r="1.2" fill="white"/>
      </svg>
    </div>
    <span class="ig-handle">@nexosmaps</span>
    <span class="ig-arrow">›</span>
  </a>

  <div class="stats-row">
    <span class="stats-txt">Mostrando <span id="cnt">86</span> lotes</span>
    <div class="vtoggle">
      <button class="vbtn active" id="vGrid">⊞</button>
      <button class="vbtn" id="vList">≡</button>
    </div>
  </div>

  <div class="grid-wrap">
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty">
      <div class="empty-i">📍</div>
      <div class="empty-t">No se encontró el lote</div>
    </div>

  </div>
</main>

<!-- MODAL -->
<div class="ov" id="ov">
  <div class="sheet" id="sheet">
    <div class="handle"></div>
    <div class="s-head">
      <div class="s-left">

var CLIMA={0:'☀️',1:'🌤️',2:'⛅',3:'☁️',45:'🌫️',48:'🌫️',51:'🌦️',53:'🌦️',55:'🌧️',61:'🌧️',63:'🌧️',65:'🌧️',71:'❄️',73:'❄️',75:'❄️',80:'🌦️',81:'🌧️',82:'⛈️',95:'⛈️',96:'⛈️',99:'⛈️'};
var cIco='🌤️',cTemp='--°';

function faseLunar(){
  var ref=new Date(Date.UTC(2000,0,6,18,14)).getTime();
  var ciclo=29.53058867*86400000;
  var f=((Date.now()-ref)%ciclo+ciclo)%ciclo/ciclo;
  return ['🌑','🌒','🌓','🌔','🌕','🌖','🌗','🌘'][Math.round(f*8)%8];
}
function getIco(h){
  if(h<20&&h>=5)return cIco;
  var lluvia=['🌦️','🌧️','⛈️','❄️','🌨️','🌫️'].includes(cIco);
  return lluvia?cIco+faseLunar():faseLunar();
}
function tick(){
  var n=new Date(),h=String(n.getHours()).padStart(2,'0'),m=String(n.getMinutes()).padStart(2,'0');
  document.getElementById('hclock').textContent=h+':'+m;
  document.getElementById('wtemp').textContent=cTemp;
  document.getElementById('wico').textContent=getIco(n.getHours());
}
async function fetchClima(){
  try{
    var r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=-34.583&longitude=-58.613&current_weather=true&timezone=America%2FArgentina%2FBuenos_Aires');
    var d=await r.json(),cw=d.current_weather||{};
    cIco=CLIMA[cw.weathercode]||'🌤️';
    cTemp=typeof cw.temperature==='number'?Math.round(cw.temperature)+'°':'--°';
    tick();
  }catch(e){}
}
tick();fetchClima();
setInterval(tick,1000);setInterval(fetchClima,600000);

// ── FAVORITOS ─────────────────────────────────────────────
var FAVS=JSON.parse(localStorage.getItem('ap_favs')||'[]');
function isFav(n){return FAVS.indexOf(n)>=0;}
function toggleFav(n,e){
  e.stopPropagation();
  var i=FAVS.indexOf(n);
  if(i>=0)FAVS.splice(i,1);else FAVS.push(n);
  localStorage.setItem('ap_favs',JSON.stringify(FAVS));
  renderGrid(currentLotes());
}

// ── ESTADO ────────────────────────────────────────────────
var currentRange='all',currentQ='',isListMode=false;
function currentLotes(){
  var lotes=LOTES;
  if(currentQ)return lotes.filter(function(l){return String(l.n).startsWith(currentQ);});
  if(currentRange==='fav')return lotes.filter(function(l){return isFav(l.n);});
  if(currentRange!=='all'){
    var p=currentRange.split('-'),lo=+p[0],hi=+p[1];
    return lotes.filter(function(l){return l.n>=lo&&l.n<=hi;});
  }
  return lotes;
}

// ── RENDER ────────────────────────────────────────────────
var grid=document.getElementById('grid'),empty=document.getElementById('empty'),cntEl=document.getElementById('cnt');
function renderGrid(lotes){
  grid.innerHTML='';
  if(!lotes.length){grid.style.display='none';empty.classList.add('on');cntEl.textContent='0';return;}
  grid.style.display='grid';empty.classList.remove('on');cntEl.textContent=lotes.length;
  if(isListMode)grid.classList.add('list');else grid.classList.remove('list');
  lotes.forEach(function(l,i){
    var c=document.createElement('div');
    c.className='card';
    c.style.animationDelay=(i*0.014)+'s';
    var fav=isFav(l.n);
    c.innerHTML=
      '<button class="fav-btn'+(fav?' on':'')+'">⭐</button>'+
      '<div class="c-lbl">lote</div>'+
      '<div class="c-num">'+l.n+'</div>'+
      '<div class="c-dot"></div>'+
      '<div class="list-info">'+
        '<div class="list-addr">Altos de Podestá · Lote '+l.n+'</div>'+
        '<div class="list-coords">'+l.lat.toFixed(5)+' / '+l.lng.toFixed(5)+'</div>'+
      '</div>'+
      '<span class="list-arr">›</span>';
    c.querySelector('.fav-btn').addEventListener('click',function(e){toggleFav(l.n,e);});
    c.addEventListener('click',function(){abrirLote(l);});
    grid.appendChild(c);
  });
}
renderGrid(currentLotes());

// ── SEARCH ────────────────────────────────────────────────
var srch=document.getElementById('srch'),srchClr=document.getElementById('srchClr');
srch.addEventListener('input',function(){
  currentQ=srch.value.trim();
  srchClr.classList.toggle('on',currentQ.length>0);
  if(currentQ){currentRange='all';setPill('all');}
  var l=currentLotes();renderGrid(l);
  if(l.length===1&&String(l[0].n)===currentQ)setTimeout(function(){abrirLote(l[0]);},300);
});
srchClr.addEventListener('click',function(){srch.value='';currentQ='';srchClr.classList.remove('on');renderGrid(currentLotes());});

// ── PILLS ─────────────────────────────────────────────────
function setPill(range){document.querySelectorAll('.pill').forEach(function(p){p.classList.toggle('active',p.dataset.range===range);});}
document.getElementById('pills').addEventListener('click',function(e){
  var pill=e.target.closest('.pill');if(!pill)return;
  currentRange=pill.dataset.range;currentQ='';srch.value='';srchClr.classList.remove('on');
  setPill(currentRange);renderGrid(currentLotes());
});

// ── VISTA ─────────────────────────────────────────────────
document.getElementById('vGrid').addEventListener('click',function(){isListMode=false;this.classList.add('active');document.getElementById('vList').classList.remove('active');renderGrid(currentLotes());});
document.getElementById('vList').addEventListener('click',function(){isListMode=true;this.classList.add('active');document.getElementById('vGrid').classList.remove('active');renderGrid(currentLotes());});

// ── MODAL ─────────────────────────────────────────────────
var ov=document.getElementById('ov'),cur=null;
function abrirLote(l){
  cur=l;
  document.getElementById('snum').textContent=l.n;
  document.getElementById('saddr').textContent='Altos de Podestá · Lote '+l.n;
  document.getElementById('slat').textContent=l.lat.toFixed(6);
  document.getElementById('slng').textContent=l.lng.toFixed(6);
  ov.classList.add('on');
  try{if(navigator.vibrate)navigator.vibrate(25);}catch(e){}
}
function cerrar(){ov.classList.remove('on');}
document.getElementById('btnCancel').addEventListener('click',cerrar);
ov.addEventListener('click',function(e){if(e.target===ov)cerrar();});
document.getElementById('btnMaps').addEventListener('click',function(){if(cur)window.open('https://www.google.com/maps/dir/?api=1&destination='+cur.lat+','+cur.lng,'_blank');});
document.getElementById('btnWaze').addEventListener('click',function(){if(cur)window.open('https://waze.com/ul?ll='+cur.lat+','+cur.lng+'&navigate=yes','_blank');});
var sy=0;
document.getElementById('sheet').addEventListener('touchstart',function(e){sy=e.touches[0].clientY;},{passive:true});
document.getElementById('sheet').addEventListener('touchend',function(e){if(e.changedTouches[0].clientY-sy>80)cerrar();},{passive:true});
</script>
