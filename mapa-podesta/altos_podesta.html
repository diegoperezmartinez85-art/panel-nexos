<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>Altos de Podestá</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#080c08">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#080c08;--bg2:#0e150e;--bg3:#141f14;--card:#111811;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.12);
  --text:#e8ede4;--muted:#6b7d6b;
  --gold:#c9a84c;--gold2:#e8c96a;
  --green:#3d7a3d;--gneon:#4ade80;--gglow:rgba(74,222,128,0.45);
  --accent:#a8d5a2;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Jost',sans-serif;overflow:hidden;}

body::before{
  content:'';position:fixed;inset:0;pointer-events:none;
  background:
    radial-gradient(ellipse 60% 40% at 15% 20%,rgba(61,122,61,0.12) 0%,transparent 60%),
    radial-gradient(ellipse 50% 60% at 85% 75%,rgba(201,168,76,0.07) 0%,transparent 55%);
}

/* ═══ HEADER ═══ */
.hdr{
  position:fixed;top:0;left:0;right:0;z-index:100;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 12px;
  display:flex;align-items:center;gap:10px;
  background:rgba(8,12,8,0.95);
  backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
}

/* Logo */
.hdr-logo{
  width:46px;height:46px;border-radius:50%;overflow:hidden;flex-shrink:0;
  box-shadow:0 0 0 2px #39ff14,0 0 10px 3px rgba(57,255,20,0.8),0 0 26px 7px rgba(57,255,20,0.45),0 0 55px 15px rgba(57,255,20,0.18);
  animation:neon 2.5s ease-in-out infinite;
}
.hdr-logo img{width:100%;height:100%;object-fit:cover;display:block;}
@keyframes neon{
  0%,100%{box-shadow:0 0 0 2px #39ff14,0 0 10px 3px rgba(57,255,20,0.8),0 0 26px 7px rgba(57,255,20,0.45),0 0 55px 15px rgba(57,255,20,0.18);}
  50%{box-shadow:0 0 0 3px #39ff14,0 0 18px 5px rgba(57,255,20,1),0 0 44px 12px rgba(57,255,20,0.65),0 0 88px 25px rgba(57,255,20,0.28);}
}

/* Título */
.hdr-title{flex:1;min-width:0;}
.hdr-name{font-family:'Playfair Display',serif;font-size:17px;font-weight:700;color:var(--gold);letter-spacing:0.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hdr-sub{font-size:8px;font-weight:300;color:var(--muted);letter-spacing:3px;text-transform:uppercase;margin-top:1px;}

/* Reloj + clima */
.hdr-right{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex-shrink:0;}
.hdr-clock{
  font-family:'Jost',sans-serif;font-size:20px;font-weight:600;
  color:var(--gneon);letter-spacing:2px;
  text-shadow:0 0 10px rgba(74,222,128,0.8),0 0 24px rgba(74,222,128,0.4);
  font-variant-numeric:tabular-nums;
}
.hdr-weather{display:flex;align-items:center;gap:5px;}
.hdr-wicon{font-size:16px;line-height:1;}
.hdr-temp{font-size:12px;font-weight:500;color:var(--gold);letter-spacing:1px;}
.hdr-badge{
  display:flex;align-items:center;gap:4px;
  background:rgba(74,222,128,0.08);border:1px solid rgba(74,222,128,0.22);
  border-radius:20px;padding:3px 8px;font-size:9px;font-weight:500;
  color:var(--gneon);letter-spacing:1px;margin-top:2px;
}
.bdot{width:4px;height:4px;border-radius:50%;background:var(--gneon);box-shadow:0 0 5px var(--gglow);animation:blink 2s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.25}}

/* Logo neon rojo - al lado del titulo */
.hdr-nexos{
  width:42px;height:42px;border-radius:12px;overflow:hidden;flex-shrink:0;
  box-shadow:
    0 0 0 2px #ff2020,
    0 0 10px 3px rgba(255,32,32,0.9),
    0 0 26px 7px rgba(255,32,32,0.55),
    0 0 55px 15px rgba(255,32,32,0.22);
  animation:neonRed 2.5s ease-in-out infinite;
}
.hdr-nexos img{width:100%;height:100%;object-fit:cover;display:block;}
@keyframes neonRed{
  0%,100%{box-shadow:0 0 0 2px #ff2020,0 0 10px 3px rgba(255,32,32,0.9),0 0 26px 7px rgba(255,32,32,0.55),0 0 55px 15px rgba(255,32,32,0.22);}
  50%{box-shadow:0 0 0 3px #ff2020,0 0 20px 6px rgba(255,32,32,1),0 0 48px 14px rgba(255,32,32,0.75),0 0 90px 28px rgba(255,32,32,0.35);}
}

/* ═══ MAIN ═══ */
.main{
  position:fixed;inset:0;
  padding-top:calc(env(safe-area-inset-top,0px) + 82px);
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 8px);
  display:flex;flex-direction:column;z-index:1;overflow:hidden;
}

/* Search */
.srch-wrap{padding:12px 16px 8px;flex-shrink:0;}
.srch-box{position:relative;display:flex;align-items:center;}
.srch-ico{position:absolute;left:14px;color:var(--muted);font-size:13px;pointer-events:none;}
.srch-input{
  width:100%;background:var(--bg3);border:1px solid var(--border2);
  border-radius:14px;padding:12px 14px 12px 38px;
  color:var(--text);font-family:'Jost',sans-serif;font-size:15px;
  outline:none;-webkit-appearance:none;transition:border-color 0.2s,box-shadow 0.2s;
}
.srch-input::placeholder{color:var(--muted);}
.srch-input:focus{border-color:rgba(74,222,128,0.4);box-shadow:0 0 0 3px rgba(74,222,128,0.08);}
.srch-clr{position:absolute;right:12px;background:none;border:none;color:var(--muted);font-size:15px;cursor:pointer;display:none;padding:4px;}
.srch-clr.on{display:block;}

/* Stats */
.stats{padding:0 16px 10px;font-size:11px;font-weight:300;color:var(--muted);letter-spacing:1px;flex-shrink:0;}
.stats span{color:var(--gold);font-weight:500;}

/* Grid */
.grid-wrap{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 14px 16px;-webkit-overflow-scrolling:touch;}
.grid-wrap::-webkit-scrollbar{display:none;}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;}

/* Card */
.card{
  background:var(--card);border:1px solid var(--border);border-radius:15px;
  aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;position:relative;overflow:hidden;
  transition:transform 0.15s,border-color 0.15s,box-shadow 0.15s;
  animation:cin 0.25s ease both;
}
@keyframes cin{from{opacity:0;transform:scale(0.88)}to{opacity:1;transform:scale(1)}}
.card:active{transform:scale(0.91);border-color:rgba(74,222,128,0.5);box-shadow:0 0 18px rgba(74,222,128,0.18);}
.card.hide{display:none;}
.c-lbl{font-size:9px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;font-weight:300;margin-bottom:2px;}
.c-num{font-family:'Playfair Display',serif;font-size:26px;font-weight:700;color:var(--text);line-height:1;}
.c-arr{font-size:10px;color:var(--gneon);margin-top:4px;opacity:0.6;}

/* Empty */
.empty{display:none;flex-direction:column;align-items:center;justify-content:center;padding:50px 20px;text-align:center;gap:8px;}
.empty.on{display:flex;}
.empty-i{font-size:34px;opacity:0.25;}
.empty-t{font-size:13px;color:var(--muted);font-weight:300;}

/* ═══ MODAL ═══ */
.ov{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,0.85);z-index:500;
  align-items:flex-end;justify-content:center;
  backdrop-filter:blur(8px);
}
.ov.on{display:flex;}
.sheet{
  background:var(--bg2);border-radius:26px 26px 0 0;
  width:100%;max-width:500px;
  padding:8px 22px calc(env(safe-area-inset-bottom,0px)+28px);
  border-top:1px solid var(--border2);
  transform:translateY(100%);transition:transform 0.32s cubic-bezier(0.32,0.72,0,1);
}
.ov.on .sheet{transform:translateY(0);}
.handle{width:38px;height:4px;background:var(--border2);border-radius:2px;margin:10px auto 22px;}
.s-lbl{font-size:9px;font-weight:500;color:var(--muted);letter-spacing:4px;text-transform:uppercase;margin-bottom:4px;}
.s-num{font-family:'Playfair Display',serif;font-size:54px;font-weight:900;color:var(--text);line-height:1;margin-bottom:3px;}
.s-addr{font-size:11px;font-weight:300;color:var(--muted);letter-spacing:1px;font-style:italic;margin-bottom:22px;}
.s-div{height:1px;background:linear-gradient(90deg,transparent,var(--border2),transparent);margin-bottom:20px;}
.coords{background:var(--bg3);border-radius:12px;padding:12px 14px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;}
.cg{text-align:center;}
.cl{font-size:8px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:2px;}
.cv{font-size:12px;font-weight:500;color:var(--accent);font-variant-numeric:tabular-nums;}
.sep{width:1px;height:32px;background:var(--border2);}
.nav-btns{display:flex;flex-direction:column;gap:9px;}
.bmaps{
  width:100%;background:linear-gradient(135deg,#1a7a2e,#2d9e42);
  border:none;border-radius:15px;padding:17px;color:white;
  font-family:'Jost',sans-serif;font-size:15px;font-weight:600;letter-spacing:0.5px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;
  box-shadow:0 4px 18px rgba(29,122,46,0.35);transition:opacity 0.15s,transform 0.15s;
}
.bmaps:active{transform:scale(0.97);opacity:0.9;}
.bwaze{
  width:100%;background:linear-gradient(135deg,#006dff,#0052cc);
  border:none;border-radius:15px;padding:15px;color:white;
  font-family:'Jost',sans-serif;font-size:14px;font-weight:500;letter-spacing:0.5px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;
  box-shadow:0 4px 14px rgba(0,109,255,0.25);transition:opacity 0.15s,transform 0.15s;
}
.bwaze:active{transform:scale(0.97);opacity:0.9;}
.bcancel{
  width:100%;background:transparent;border:1px solid var(--border);
  border-radius:15px;padding:13px;color:var(--muted);
  font-family:'Jost',sans-serif;font-size:14px;cursor:pointer;transition:background 0.15s;
}
.bcancel:active{background:var(--bg3);}

@media(max-width:360px){.grid{grid-template-columns:repeat(3,1fr);}.c-num{font-size:22px;}}
@media(min-width:480px){.grid{grid-template-columns:repeat(5,1fr);}}
</style>
</head>

</div>

var CLIMA = {0:'☀️',1:'🌤️',2:'⛅',3:'☁️',45:'🌫️',48:'🌫️',51:'🌦️',53:'🌦️',55:'🌧️',61:'🌧️',63:'🌧️',65:'🌧️',71:'❄️',73:'❄️',75:'❄️',80:'🌦️',81:'🌧️',82:'⛈️',95:'⛈️',96:'⛈️',99:'⛈️'};
var climaIcon = '🌤️', tempVal = '--°';

function faseLunar() {
  var ref = new Date(Date.UTC(2000,0,6,18,14)).getTime();
  var ciclo = 29.53058867 * 86400000;
  var fase = ((Date.now()-ref) % ciclo + ciclo) % ciclo / ciclo;
  return ['🌑','🌒','🌓','🌔','🌕','🌖','🌗','🌘'][Math.round(fase*8)%8];
}

function iconoClima(hora) {
  var noche = hora >= 20 || hora < 5;
  if (!noche) return climaIcon;
  var lluvia = ['🌦️','🌧️','⛈️','❄️','🌨️','🌫️'].indexOf(climaIcon) >= 0;
  return lluvia ? climaIcon + faseLunar() : faseLunar();
}

function tick() {
  var now = new Date();
  var h = String(now.getHours()).padStart(2,'0');
  var m = String(now.getMinutes()).padStart(2,'0');
  document.getElementById('hclock').textContent = h + ':' + m;
  document.getElementById('wtemp').textContent = tempVal;
  document.getElementById('wicon').textContent = iconoClima(now.getHours());
}

async function fetchClima() {
  try {
    var r = await fetch('https://api.open-meteo.com/v1/forecast?latitude=-34.583&longitude=-58.613&current_weather=true&timezone=America%2FArgentina%2FBuenos_Aires');
    var d = await r.json();
    var cw = d.current_weather || {};
    var code = cw.weathercode != null ? cw.weathercode : 1;
    var temp = cw.temperature;
    climaIcon = CLIMA[code] || '🌤️';
    tempVal = (typeof temp === 'number') ? Math.round(temp) + '°' : '--°';
    tick();
  } catch(e) {}
}

tick();
fetchClima();
setInterval(tick, 1000);
setInterval(fetchClima, 600000);

// ── GRID ──────────────────────────────────────────────────
var grid = document.getElementById('grid');
var empty = document.getElementById('empty');
var cntEl = document.getElementById('cnt');

function renderGrid(lotes) {
  grid.innerHTML = '';
  if (!lotes.length) {
    grid.style.display = 'none';
    empty.classList.add('on');
    cntEl.textContent = '0';
    return;
  }
  grid.style.display = 'grid';
  empty.classList.remove('on');
  cntEl.textContent = lotes.length;
  lotes.forEach(function(l, i) {
    var c = document.createElement('div');
    c.className = 'card';
    c.style.animationDelay = (i * 0.018) + 's';
    c.innerHTML = '<div class="c-lbl">lote</div><div class="c-num">' + l.n + '</div><div class="c-arr">▲</div>';
    c.addEventListener('click', function() { abrirLote(l); });
    grid.appendChild(c);
  });
}
renderGrid(LOTES);

// ── SEARCH ────────────────────────────────────────────────
var srch = document.getElementById('srch');
var srchClr = document.getElementById('srchClr');

srch.addEventListener('input', function() {
  var q = srch.value.trim();
  srchClr.classList.toggle('on', q.length > 0);
  if (!q) { renderGrid(LOTES); return; }
  var fil = LOTES.filter(function(l){ return String(l.n).startsWith(q); });
  renderGrid(fil);
  if (fil.length === 1 && String(fil[0].n) === q) setTimeout(function(){ abrirLote(fil[0]); }, 300);
});

srchClr.addEventListener('click', function() {
  srch.value = '';
  srchClr.classList.remove('on');
  renderGrid(LOTES);
});

// ── MODAL ─────────────────────────────────────────────────
var ov = document.getElementById('ov');
var cur = null;

function abrirLote(l) {
  cur = l;
  document.getElementById('snum').textContent = l.n;
  document.getElementById('saddr').textContent = 'Altos de Podestá · Lote ' + l.n;
  document.getElementById('slat').textContent = l.lat.toFixed(6);
  document.getElementById('slng').textContent = l.lng.toFixed(6);
  ov.classList.add('on');
  try { if (navigator.vibrate) navigator.vibrate(30); } catch(e){}
}
function cerrar() { ov.classList.remove('on'); }

document.getElementById('btnCancel').addEventListener('click', cerrar);
ov.addEventListener('click', function(e){ if(e.target===ov) cerrar(); });

document.getElementById('btnMaps').addEventListener('click', function(){
  if (!cur) return;
  window.open('https://www.google.com/maps/dir/?api=1&destination='+cur.lat+','+cur.lng,'_blank');
});
document.getElementById('btnWaze').addEventListener('click', function(){
  if (!cur) return;
  window.open('https://waze.com/ul?ll='+cur.lat+','+cur.lng+'&navigate=yes','_blank');
});

// Swipe down
var sy = 0;
document.getElementById('sheet').addEventListener('touchstart', function(e){ sy = e.touches[0].clientY; },{passive:true});
document.getElementById('sheet').addEventListener('touchend', function(e){ if(e.changedTouches[0].clientY - sy > 80) cerrar(); },{passive:true});
</script>
