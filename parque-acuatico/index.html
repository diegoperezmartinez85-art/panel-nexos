<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--sea:#0b7fb5;--sea2:#14a7d9;--ink:#0e3247;--mut:#5d7686;--card:#fff;--line:rgba(14,50,71,.12);--ext:#e23b3b;--mod:#f2a20c;--fam:#21a249;--com:#e2468f;--rel:#2a3d8f;--srv:#0ea5e9}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:#e9dcc0;color:var(--ink);font:600 15px/1.35 Nunito,system-ui,-apple-system,sans-serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#stage{position:fixed;inset:0;touch-action:none;overflow:hidden;background:#efe3c8;-webkit-user-select:none;user-select:none}
#svg{position:absolute;left:0;top:0;display:block;transform-origin:0 0;backface-visibility:hidden}
/* vida */
.spk{fill:#fff;opacity:0;animation:spk 3.2s ease-in-out infinite}
@keyframes spk{0%,100%{opacity:0;transform:scale(.4)}45%{opacity:.95;transform:scale(1)}60%{opacity:.2}}
.spk{transform-box:fill-box;transform-origin:center}
.wsh{fill:url(#wgrad);opacity:.38}
.swim{animation:bob 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes bob{0%,100%{transform:translate(0,0) rotate(-6deg)}50%{transform:translate(4px,-3px) rotate(6deg)}}
.cloud{fill:url(#cg);animation:drift linear infinite;will-change:transform}
@keyframes drift{from{transform:translateX(-900px)}to{transform:translateX(3200px)}}
.bird{fill:none;stroke:#2b3b44;stroke-width:2.4;stroke-linecap:round;animation:fly linear infinite}
@keyframes fly{from{transform:translate(-200px,0)}to{transform:translate(2700px,-220px)}}
.bird path{animation:flap .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes flap{from{transform:scaleY(1)}to{transform:scaleY(-.5)}}
.hot{fill:transparent;cursor:pointer}
.ring{fill:none;stroke-width:3.5;opacity:.95;transform-box:fill-box;transform-origin:center;animation:ring 1.8s ease-out 3 forwards}
@keyframes ring{0%{transform:scale(.6);opacity:.95}100%{transform:scale(1.9);opacity:0}}
.ext .ring{stroke:var(--ext)}.mod .ring{stroke:var(--mod)}.fam .ring{stroke:var(--fam)}.com .ring{stroke:var(--com)}.rel .ring{stroke:var(--rel)}.srv .ring{stroke:var(--srv)}
.hl{display:none}.show .hl{display:block}
.pinb{filter:drop-shadow(0 6px 8px rgba(0,0,0,.35))}
#route{fill:none;stroke:#fff;stroke-width:15;stroke-linecap:round;stroke-linejoin:round;opacity:.95}
#route2{fill:none;stroke:var(--sea);stroke-width:8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:2 18;animation:march 1s linear infinite}
@keyframes march{to{stroke-dashoffset:-20}}
#tint{position:fixed;inset:0;pointer-events:none;z-index:1;transition:background 2s}
/* top */
.top{position:fixed;left:0;right:0;top:0;z-index:20;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 10px;background:linear-gradient(180deg,rgba(255,255,255,.97) 72%,rgba(255,255,255,0));pointer-events:none}
.top>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:10px}
.drop{width:42px;height:42px;border-radius:14px;flex:none;display:grid;place-items:center;background:linear-gradient(135deg,#21c3f0,#0b7fb5);box-shadow:0 6px 16px rgba(11,127,181,.35)}
.drop svg{width:24px;height:24px}
.ttl .k{font:800 11px/1 Nunito;letter-spacing:2.2px;text-transform:uppercase;color:var(--sea2)}
.ttl .t{font:700 25px/1.05 Fredoka,Nunito;color:var(--sea)}
.wx{margin-left:auto;text-align:right;flex:none}
.wx .c{font:700 22px/1 Fredoka;color:var(--ink);font-variant-numeric:tabular-nums}
.wx .w{font:700 12.5px Nunito;color:var(--mut);margin-top:3px;display:flex;gap:5px;justify-content:flex-end;align-items:center}
.wx .w svg{width:16px;height:16px;color:#f59e0b}
.srch{margin-top:10px;position:relative}
.box{display:flex;align-items:center;gap:9px;height:48px;padding:0 14px;border-radius:16px;background:#fff;box-shadow:0 6px 22px rgba(14,50,71,.13),inset 0 0 0 1.5px var(--line)}
.box:focus-within{box-shadow:0 6px 22px rgba(14,50,71,.15),inset 0 0 0 2px var(--sea2)}
.box svg{width:20px;height:20px;color:var(--mut);flex:none}
.box input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:700 16px Nunito;color:var(--ink)}
.box input::placeholder{color:#8aa0ad;font-weight:600}
.sug{position:absolute;left:0;right:0;top:54px;background:#fff;border-radius:16px;box-shadow:0 14px 34px rgba(14,50,71,.2);overflow:hidden;display:none;max-height:52vh;overflow-y:auto}
.sug.on{display:block}
.sug button{display:flex;width:100%;align-items:center;gap:10px;padding:11px 14px;text-align:left;border-bottom:1px solid var(--line);font:700 15px Nunito}
.sug button small{margin-left:auto;color:var(--mut);font-weight:600;font-size:12px}
.dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;font:800 11px Nunito;flex:none}
.chips{display:flex;gap:7px;margin-top:9px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 12px;border-radius:12px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line),0 3px 10px rgba(14,50,71,.08);font:800 13px Nunito;display:flex;align-items:center;gap:6px;white-space:nowrap}
.chip i{width:9px;height:9px;border-radius:50%}
.chip.on{color:#fff;box-shadow:0 6px 16px rgba(14,50,71,.2)}
/* aviso */
.av{position:fixed;left:12px;right:12px;z-index:15;top:calc(env(safe-area-inset-top,0px) + 168px);height:38px;border-radius:12px;background:rgba(14,50,71,.93);color:#fff;display:flex;align-items:center;gap:9px;padding:0 12px;overflow:hidden;font:700 13px Nunito}
.av b{flex:none;font:800 10.5px Nunito;letter-spacing:1.2px;text-transform:uppercase;background:#f59e0b;color:#3b2200;padding:3px 7px;border-radius:7px}
.av .tk{flex:1;min-width:0;white-space:nowrap;overflow:hidden;position:relative}
.av .tk span{display:inline-block;transition:transform .5s,opacity .5s}
.av em{font-style:normal;flex:none;font-size:10.5px;opacity:.6;letter-spacing:.5px}
/* zoom */
.zm{position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 66px);z-index:14;display:flex;flex-direction:column;gap:8px}
.zm button{width:44px;height:44px;border-radius:14px;background:#fff;box-shadow:0 6px 18px rgba(14,50,71,.18);display:grid;place-items:center}
.zm svg{width:20px;height:20px;color:var(--ink)}
/* origen */
.org{position:fixed;left:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 66px);z-index:14;height:44px;border-radius:14px;background:#fff;box-shadow:0 6px 18px rgba(14,50,71,.18);display:flex;align-items:center;gap:8px;padding:0 12px;font:800 13px Nunito;max-width:calc(100% - 90px)}
.org svg{width:18px;height:18px;color:var(--sea);flex:none}
.org span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.org.pick{background:var(--sea);color:#fff}.org.pick svg{color:#fff}
.nx{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);z-index:14;padding:8px 14px;border-radius:20px;background:rgba(255,255,255,.92);box-shadow:0 4px 14px rgba(14,50,71,.15);font:800 11.5px Nunito;color:var(--ink);white-space:nowrap;display:flex;align-items:center;gap:7px}
.nx i{width:8px;height:8px;border-radius:50%;background:linear-gradient(135deg,#22d3ee,#8b5cf6)}
.nx a{color:var(--sea);text-decoration:none}
/* sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-radius:24px 24px 0 0;box-shadow:0 -12px 40px rgba(14,50,71,.25);padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 16px);transform:translateY(110%);transition:transform .35s cubic-bezier(.2,.9,.25,1);max-width:560px;margin:0 auto}
.sheet.on{transform:none}
.sheet.mini .desc,.sheet.mini .acts{display:none}.sheet.mini .meta{margin-top:8px}.sheet .more{display:none;width:100%;margin-top:10px;height:40px;border-radius:12px;background:#f1f5f7;font:800 13.5px Nunito;color:var(--sea)}.sheet.mini .more{display:block}
.grab{width:42px;height:5px;border-radius:3px;background:#d4dde2;margin:0 auto 10px}
.sh{display:flex;gap:12px;align-items:flex-start}
.big{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;color:#fff;font:700 22px Fredoka;flex:none;box-shadow:0 6px 16px rgba(0,0,0,.18)}
.sh h2{font:700 22px/1.1 Fredoka;color:var(--ink)}
.tag{display:inline-flex;align-items:center;gap:6px;margin-top:5px;font:800 12px Nunito;color:var(--mut)}
.sem{display:inline-flex;gap:3px}.sem i{width:9px;height:9px;border-radius:50%;background:#dfe6ea}
.x{margin-left:auto;width:38px;height:38px;border-radius:12px;background:#f1f5f7;display:grid;place-items:center;flex:none}
.x svg{width:18px;height:18px}
.desc{margin:10px 0 0;color:#3d5664;font-weight:600}
.meta{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.meta span{background:#eef7fb;color:var(--sea);border-radius:10px;padding:6px 10px;font:800 12.5px Nunito}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.go{height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:8px;font:800 15px Nunito;background:#f1f5f7;color:var(--ink)}
.go svg{width:19px;height:19px}
.go.p{grid-column:1/-1;background:linear-gradient(135deg,#21c3f0,#0b7fb5);color:#fff;box-shadow:0 8px 20px rgba(11,127,181,.35)}
.toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.95);z-index:50;background:rgba(14,50,71,.92);color:#fff;padding:11px 16px;border-radius:14px;font:800 14px Nunito;opacity:0;pointer-events:none;transition:.25s;text-align:center;max-width:80%}
.toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.lbl{font:700 22px Fredoka;fill:#fff;paint-order:stroke;stroke:rgba(14,50,71,.85);stroke-width:6px;text-anchor:middle;pointer-events:none}
@media (min-width:760px){.top{max-width:560px;border-radius:0 0 20px 0}.av{right:auto;width:536px}}

.logo{position:relative;flex:none;display:block;height:54px;filter:drop-shadow(0 6px 12px rgba(11,60,100,.28));transition:transform .2s}
.logo:active{transform:scale(.96)}
.logo img{height:54px;width:auto;display:block}
.logo .ig{position:absolute;right:-6px;bottom:-4px;width:22px;height:22px;border-radius:7px;display:grid;place-items:center;background:linear-gradient(45deg,#f9ce34,#ee2a7b 55%,#6228d7);box-shadow:0 3px 8px rgba(0,0,0,.25);border:2px solid #fff}
.logo .ig svg{width:12px;height:12px}
.ttl{min-width:0}.ttl .t2{font:700 13.5px Nunito;color:var(--mut);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wx .more{display:flex;align-items:center;justify-content:flex-end;gap:2px;font:800 11px Nunito;color:var(--sea);margin-top:3px;letter-spacing:.3px}.wx .more svg{width:12px;height:12px}
/* pronóstico */
.modal{position:fixed;inset:0;z-index:60;background:rgba(8,30,45,.45);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
.modal.on{opacity:1;pointer-events:auto}
.mcard{position:relative;width:100%;max-width:560px;background:#fff;border-radius:26px 26px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateY(40px);transition:transform .3s cubic-bezier(.2,.9,.25,1);max-height:88vh;overflow:auto}
.modal.on .mcard{transform:none}
.fhero{border-radius:20px;padding:16px;color:#fff;background:linear-gradient(135deg,#21c3f0,#0b7fb5 60%,#0a5f8a);position:relative;overflow:hidden}
.fhero .tt{font:800 12px Nunito;letter-spacing:1.5px;text-transform:uppercase;opacity:.85}
.fhero .tp{font:700 54px/1 Fredoka;margin-top:6px;display:flex;align-items:center;gap:10px}.fhero .tp svg{width:52px;height:52px}
.fhero .ds{font:700 15px Nunito;margin-top:6px;opacity:.95}
.fhero .row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.fhero .row span{background:rgba(255,255,255,.18);border-radius:10px;padding:6px 10px;font:800 12.5px Nunito}
.fhero:after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.12)}
.uvt{margin-top:10px;border-radius:14px;padding:10px 12px;font:800 13px Nunito;display:flex;gap:8px;align-items:center}
.days{margin-top:12px}.day{display:grid;grid-template-columns:64px 34px 1fr 52px;align-items:center;gap:8px;padding:10px 4px;border-bottom:1px solid var(--line)}
.day b{font:800 14.5px Nunito}.day small{display:block;font:700 11.5px Nunito;color:var(--mut)}
.day svg{width:28px;height:28px}
.bar{height:8px;border-radius:5px;background:#eef3f6;position:relative}.bar i{position:absolute;top:0;bottom:0;border-radius:5px;background:linear-gradient(90deg,#38bdf8,#f59e0b)}
.day .rn{text-align:right;font:800 12.5px Nunito;color:#0b7fb5}
.tmm{display:flex;justify-content:space-between;font:800 12.5px Nunito;color:var(--ink);margin-top:3px}
.mx{position:absolute;right:14px;top:14px;z-index:5;width:44px;height:44px;background:rgba(255,255,255,.95);box-shadow:0 4px 14px rgba(0,0,0,.18)}
.fback{display:block;width:100%;margin-top:14px;height:50px;border-radius:15px;background:#0e3247;color:#fff;font:800 15px Nunito}
/* navegación */
#kidg .kd{transform-box:fill-box}
.kleg,.karm{transform-box:fill-box;transform-origin:50% 0}
.walking .kl1{animation:sw1 .42s ease-in-out infinite alternate}.walking .kl2{animation:sw1 .42s ease-in-out infinite alternate-reverse}
.walking .ka1{animation:sw2 .42s ease-in-out infinite alternate}.walking .ka2{animation:sw2 .42s ease-in-out infinite alternate-reverse}
.walking .kbd{animation:bobk .21s ease-in-out infinite alternate}
@keyframes sw1{from{transform:rotate(26deg)}to{transform:rotate(-26deg)}}
@keyframes sw2{from{transform:rotate(-30deg)}to{transform:rotate(30deg)}}
@keyframes bobk{from{transform:translateY(0)}to{transform:translateY(-2.5px)}}
.wave .ka2{animation:wv .5s ease-in-out infinite alternate;transform-origin:50% 0}
@keyframes wv{from{transform:rotate(150deg)}to{transform:rotate(195deg)}}
.halo{fill:rgba(14,165,233,.22);stroke:rgba(14,165,233,.7);stroke-width:1.5}
.nav{position:fixed;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:40;max-width:560px;margin:0 auto;background:#0e3247;color:#fff;border-radius:22px;padding:12px 12px 12px 14px;display:none;align-items:center;gap:12px;box-shadow:0 14px 40px rgba(8,30,45,.45)}
.nav.on{display:flex;animation:navin .35s cubic-bezier(.2,.9,.25,1)}
@keyframes navin{from{transform:translateY(30px);opacity:0}}
.nav .ic{width:46px;height:46px;border-radius:14px;flex:none;display:grid;place-items:center;font:700 20px Fredoka;color:#fff}
.nav .tx{flex:1;min-width:0}.nav .tx b{display:block;font:700 19px/1.1 Fredoka;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav .tx span{display:block;font:800 13px Nunito;opacity:.8;margin-top:3px}
.nav .md{display:inline-block;font:800 10px Nunito;letter-spacing:1px;text-transform:uppercase;padding:3px 7px;border-radius:7px;background:#f59e0b;color:#3b2200;margin-left:6px;vertical-align:2px}
.nav .md.live{background:#22c55e;color:#052e14}
.nav button{flex:none;height:42px;padding:0 14px;border-radius:13px;background:rgba(255,255,255,.14);font:800 13.5px Nunito;color:#fff}
.navon .zm,.navon .org,.navon .nx,.navon .av,.navon .srch,.navon .chips{display:none}
.navon .sheet{transform:translateY(110%)}
.arr{position:fixed;inset:0;z-index:70;display:grid;place-items:center;pointer-events:none;opacity:0;transition:opacity .3s}
.arr.on{opacity:1;pointer-events:auto}
.arr .c{background:#fff;border-radius:26px;padding:22px 22px 18px;text-align:center;width:min(86vw,360px);box-shadow:0 20px 60px rgba(8,30,45,.4);transform:scale(.9);transition:transform .35s cubic-bezier(.2,1.4,.4,1)}
.arr.on .c{transform:none}
.arr h3{font:700 26px Fredoka;color:var(--sea);margin-top:6px}.arr p{color:var(--mut);font-weight:700;margin-top:4px}
.arr button{margin-top:14px;width:100%;height:46px;border-radius:14px;background:linear-gradient(135deg,#21c3f0,#0b7fb5);color:#fff;font:800 15px Nunito}
.drp{position:fixed;z-index:69;width:10px;height:14px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:#38bdf8;pointer-events:none}

#svg{overflow:visible}
.slbl text{font-family:Fredoka,Nunito,sans-serif;paint-order:stroke;stroke:#fff;stroke-linejoin:round;pointer-events:none}
.slbl .rl{font-size:30px;font-weight:700;fill:#5b5249;stroke-width:7px;text-anchor:middle;letter-spacing:1px}
.slbl .dir{font-size:34px;font-weight:700;fill:#0b7fb5;stroke-width:8px}
.slbl .cl{font-size:26px;font-weight:600;fill:#7a6a55;stroke-width:6px;text-anchor:middle}
.slbl .pl{font-size:32px;font-weight:700;fill:#2f6b2a;stroke-width:7px;text-anchor:middle}
.fsp .p1{fill:#f97316;stroke:#fff;stroke-width:3}.fsp .p2{fill:none;stroke:#f97316;stroke-width:3;transform-box:fill-box;transform-origin:center;animation:ring 1.8s ease-out infinite}
.adc{display:flex;gap:11px;align-items:center;margin-top:10px;padding:10px 12px;border-radius:14px;background:linear-gradient(135deg,#fff7e6,#fff);border:1px dashed #f5b84a;text-decoration:none;color:var(--ink)}
.adc i{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:#ffe9bf;flex:none}.adc i svg{width:22px;height:22px}
.adc small{display:block;font:800 9.5px Nunito;letter-spacing:.9px;text-transform:uppercase;color:#b7791f}.adc b{display:block;font:800 14px Nunito}.adc span{display:block;font:700 12px Nunito;color:var(--mut)}
.sheet.mini .adc{display:none}
.go.ph{grid-column:1/-1;background:linear-gradient(135deg,#fbbf24,#f97316);color:#fff;box-shadow:0 8px 20px rgba(249,115,22,.3)}
.phm .mcard img{width:100%;border-radius:16px;display:block;margin-top:44px}
.phm .b2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.phm .b2 button,.phm .b2 a{height:48px;border-radius:14px;display:grid;place-items:center;font:800 15px Nunito;text-decoration:none}
.phm .s1{background:linear-gradient(135deg,#21c3f0,#0b7fb5);color:#fff}.phm .s2{background:#f1f5f7;color:var(--ink)}
.av b.pub{background:#a78bfa;color:#1e1047}

.clist{display:none;margin-top:8px;background:#fff;border-radius:18px;box-shadow:0 14px 34px rgba(14,50,71,.2);max-height:min(46vh,420px);overflow-y:auto;overscroll-behavior:contain}
.clist.on{display:block;animation:clin .25s cubic-bezier(.2,.9,.25,1)}
@keyframes clin{from{opacity:0;transform:translateY(-8px)}}
.clh{position:sticky;top:0;z-index:1;display:flex;align-items:center;gap:8px;padding:11px 12px 9px 14px;background:#fff;border-bottom:1px solid var(--line);font:800 12px Nunito;letter-spacing:1.2px;text-transform:uppercase;color:var(--mut)}
.clh b{flex:1}.clh button{height:30px;padding:0 10px;border-radius:9px;background:#f1f5f7;font:800 12px Nunito;letter-spacing:0;text-transform:none;color:var(--ink)}
.clg{padding:8px 14px 4px;font:800 12.5px Nunito;display:flex;align-items:center;gap:7px}.clg i{width:9px;height:9px;border-radius:50%}.clg small{color:var(--mut);font-weight:700}
.cli{display:flex;width:100%;align-items:center;gap:11px;padding:9px 14px;text-align:left;font:700 15px Nunito;color:var(--ink)}
.cli:active{background:#f1f7fa}.cli .dot{width:28px;height:28px;font-size:12.5px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.cli em{margin-left:auto;font-style:normal;font:700 12px Nunito;color:var(--mut);white-space:nowrap}
.cli svg{width:16px;height:16px;color:#9fb3bf;flex:none}
body.lst .av,body.sh .av{display:none}
.nxi .nxi-ok,.nxi .nxi-ic{background:linear-gradient(135deg,#21c3f0,#0b7fb5)!important}
.nxi{background:#0e3247!important}

.upd{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translate(-50%,-140%);z-index:90;display:flex;align-items:center;gap:10px;padding:9px 9px 9px 14px;border-radius:16px;background:#0e3247;color:#fff;box-shadow:0 12px 32px rgba(8,30,45,.4);font:800 13.5px Nunito;white-space:nowrap;transition:transform .45s cubic-bezier(.2,1.2,.4,1)}
.upd.on{transform:translate(-50%,0)}.upd i{width:9px;height:9px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 4px rgba(34,197,94,.25)}
.upd button{height:34px;padding:0 13px;border-radius:11px;background:linear-gradient(135deg,#21c3f0,#0b7fb5);color:#fff;font:800 13px Nunito}.upd .ux{background:rgba(255,255,255,.14);padding:0 10px}
.moving .spk,.moving .swim,.moving .cloud,.moving .bird,.moving .bird path,.moving .ring,.moving .halo{animation-play-state:paused!important}
.moving #svg{will-change:transform}
.navon .spk,.navon .swim,.navon .cloud,.navon .bird{animation-play-state:paused!important;visibility:hidden}
.nx{gap:8px;padding:6px 14px 6px 6px;text-decoration:none;color:var(--ink)}
.nx img{width:24px;height:24px;border-radius:7px;display:block;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.nx b{color:var(--sea);font-weight:800}
.nx .ig2{width:14px;height:14px;opacity:.55;margin-left:-2px}
